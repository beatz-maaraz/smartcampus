name: ai_campus_assistant
description: "AI-Powered Smart Campus Assistant - Team Artemis, Selvam College of Technology"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.2
  go_router: ^14.3.0

  # Session persistence
  shared_preferences: ^2.2.3

  # Date/time formatting
  intl: ^0.19.0

  # Networking
  http: ^1.2.2

  cupertino_icons: ^1.0.8
  image_picker: ^1.2.3
  url_launcher: ^6.3.2

  # Google Drive persistence (timetables, events, locations, students,
  # attendance — see lib/google_drive_service.dart)
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.4

  # Study Materials — file upload/download (lib/study_materials_screen.dart)
  file_picker: ^12.0.0
  path_provider: ^2.1.4
  geolocator: ^14.0.3
  flutter_image_compress: ^2.5.1
  permission_handler: ^13.0.1
  camera: ^0.12.0+2
  google_fonts: ^8.2.1
  crypto: ^3.0.7
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  cloud_functions: ^6.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

# Bypasses the SDK check and forces the fixed Android plugin build.
# path_provider_foundation is pinned below 2.4.0 because 2.4.0+ depends on
# package:objective_c, which requires Dart's native-assets build system —
# and that currently fails on Windows when the project/user path contains
# spaces (as this one does: "HP ELITEBOOK"). This only affects macOS's
# implementation of path_provider, which this app never runs (Android-only
# target), so pinning it has zero effect on actual app behavior.
dependency_overrides:
  shared_preferences_android: 2.2.4
  path_provider_foundation: 2.3.2
